      const STORAGE_KEY = 'chaekmaru_libraries_v1';

      function loadSavedLibraries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DEFAULT_LIBRARIES;
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            return DEFAULT_LIBRARIES;
          }
          return parsed;
        } catch {
          return DEFAULT_LIBRARIES;
        }
      }

      function saveLibraries(libraries) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(libraries));
        } catch {

        }

      function cleanText(value) {
        return (value || '').replace(/\s+/g, ' ').trim();
      }

      function normalizeDirectCoverUrl(rawSrc, origin) {
        if (!rawSrc) return '';
        const trimmed = rawSrc.trim();
        if (!trimmed || trimmed.includes('L_NOBOOK') || trimmed.includes('nobook')) {
          return '';
        }
        if (trimmed.startsWith('//')) {
          return `https:${trimmed}`;
        }
        if (trimmed.startsWith('/')) {
          return `${origin}${trimmed}`;
        }
        if (!trimmed.startsWith('http')) {
          return `${origin}/${trimmed}`;
        }
        return trimmed;
      }

      function decodeBase64Bytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      }

      function decodeTextBytes(bufferOrBytes, encoding = 'utf-8') {
        try {
          return new TextDecoder(encoding).decode(bufferOrBytes);
        } catch {
          return new TextDecoder('utf-8').decode(bufferOrBytes);
        }
      }

      let eucKrEncodeMap = null;
      function encodeEucKrQuery(query) {
        try {
          if (!eucKrEncodeMap) {
            const map = new Map();
            const dec = new TextDecoder('euc-kr');
            const pair = new Uint8Array(2);
            for (let b1 = 0xA1; b1 <= 0xFE; b1++) {
              pair[0] = b1;
              for (let b2 = 0xA1; b2 <= 0xFE; b2++) {
                pair[1] = b2;
                const ch = dec.decode(pair);
                if (ch && ch !== '\uFFFD' && ch.length === 1 && !map.has(ch)) {
                  map.set(
                    ch,
                    `%${b1.toString(16).toUpperCase()}%${b2.toString(16).toUpperCase()}`
                  );
                }
              }
            }
            for (let b1 = 0x81; b1 <= 0xC6; b1++) {
              pair[0] = b1;
              for (let b2 = 0x41; b2 <= 0xFE; b2++) {
                if (b1 >= 0xA1 && b2 >= 0xA1) continue;
                pair[1] = b2;
                const ch = dec.decode(pair);
                if (ch && ch !== '\uFFFD' && ch.length === 1 && !map.has(ch)) {
                  map.set(
                    ch,
                    `%${b1.toString(16).toUpperCase()}%${b2.toString(16).toUpperCase()}`
                  );
                }
              }
            }
            eucKrEncodeMap = map;
          }
          let out = '';
          for (const ch of query) {
            const code = ch.charCodeAt(0);
            if (code < 0x80) {
              out += encodeURIComponent(ch);
            } else if (eucKrEncodeMap.has(ch)) {
              out += eucKrEncodeMap.get(ch);
            } else {
              out += encodeURIComponent(ch);
            }
          }
          return out;
        } catch {
          return encodeURIComponent(query);
        }
      }

            type: 'raw',
            timeout: Math.min(timeoutMs, 4000),
            build: (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
          },
          {
            type: 'json',
            timeout: Math.min(timeoutMs, 4000),
            build: (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
          },
        ];

        for (const proxy of proxyBuilders) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), proxy.timeout || timeoutMs);
          try {
            const res = await fetch(proxy.build(targetUrl), {
              ...(proxy.options || {}),
              signal: controller.signal,
            });
            clearTimeout(timer);
            if (!res.ok) continue;

            if (proxy.type === 'jina') {
              const text = await res.text();
              if (!text || text.trim().startsWith('{')) continue;
              return text;
            } else if (proxy.type === 'json') {
              const data = await res.json();
              if (!data || !data.contents) continue;
              if (data.contents.startsWith('data:')) {
                const commaIdx = data.contents.indexOf(',');
                if (commaIdx !== -1) {
                  const b64 = data.contents.slice(commaIdx + 1);
                  const bytes = decodeBase64Bytes(b64);
                  return decodeTextBytes(bytes, encoding);
                }
              }
              return data.contents;
            } else {
              const buf = await res.arrayBuffer();
              return decodeTextBytes(buf, encoding);
            }
          } catch {
            clearTimeout(timer);
          }
        }

        throw new Error('도서관 실시간 검색 연결 지연');
      }

      function parseKyoboDom(html, library, searchUrl) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const origin = new URL(library.baseUrl).origin;
        const results = [];

        doc.querySelectorAll('.book_resultList > li').forEach((el) => {
          const titEl = el.querySelector('li.tit a');
          const title = cleanText(titEl ? titEl.textContent : '');
          if (!title) return;

          const writerEl = el.querySelector('li.writer');
          let publisher = '';
          let author = '';
          let publishDate = '';

          if (writerEl) {
            const spanEl = writerEl.querySelector('span');
            publisher = cleanText(spanEl ? spanEl.textContent : '');
            const clone = writerEl.cloneNode(true);
            const cloneSpan = clone.querySelector('span');
            if (cloneSpan) cloneSpan.remove();
            const rawWriterText = cleanText(clone.textContent);
            const dateMatch = rawWriterText.match(/\d{4}-\d{2}-\d{2}/);
            publishDate = dateMatch ? dateMatch[0] : '';
            author = cleanText(
              dateMatch ? rawWriterText.replace(dateMatch[0], '') : rawWriterText
            );
          }

          const txtEl = el.querySelector('li.txt');
          const description = cleanText(txtEl ? txtEl.textContent : '');
          const imgEl = el.querySelector('.img img');
          const coverUrl = normalizeDirectCoverUrl(
            imgEl ? imgEl.getAttribute('src') : '',
            origin
          );
          const formatEl = el.querySelector('span.small');
          const format = cleanText(formatEl ? formatEl.textContent : '') || '전자책';
          const storeEl = el.querySelector('span.store');
          const vendor = cleanText(storeEl ? storeEl.textContent : '') || '교보문고';

          const useEl = el.querySelector('p.use');
          const useText = cleanText(useEl ? useEl.textContent : '');
          const loanMatch = useText.match(/대출\s*:\s*(\d+)\s*\/\s*(\d+)/);
          const reserveMatch = useText.match(/예약\s*:\s*(\d+)/);

          const buttonLabels = Array.from(el.querySelectorAll('input[type="button"]'))
            .map((btn) => cleanText(btn.value || btn.getAttribute('value') || ''));

          let status = 'available';
          let loanedCopies;
          let totalCopies;
          let availableCopies;
          let reservedCount;

          if (loanMatch) {
            loanedCopies = parseInt(loanMatch[1], 10);
            totalCopies = parseInt(loanMatch[2], 10);
            reservedCount = reserveMatch ? parseInt(reserveMatch[1], 10) : 0;
            availableCopies = Math.max(0, totalCopies - loanedCopies);
            status = availableCopies > 0 ? 'available' : 'loaned';
          } else if (library.category === 'subscription' || buttonLabels.includes('대출')) {
            status =
              library.category === 'subscription'
                ? 'subscription_available'
                : 'available';
          } else if (buttonLabels.includes('예약')) {
            status = 'loaned';
          }

          const directSearchUrl = `${library.baseUrl.replace(/\/$/, '')}/search/searchList.ink?schDvsn=000&schTxt=${encodeURIComponent(title)}`;

          results.push({
            libraryId: library.id,
            title,
            author: author || '저자 미상',
            publisher: publisher || '출판사 정보 없음',
            publishDate,
            description,
            coverUrl,
            detailUrl: directSearchUrl || searchUrl,
            vendor,
            format,
            status,
            totalCopies,
            loanedCopies,
            availableCopies,
            reservedCount,
          });
        });

        return results;
      }

      async function searchKyoboLibraryClient(library, query, field) {
        const base = library.baseUrl.replace(/\/$/, '');
        const schDvsn = field === 'title' ? '001' : field === 'author' ? '002' : '000';
        const searchUrl = `${base}/search/searchList.ink?schDvsn=${schDvsn}&schTxt=${encodeURIComponent(query)}&selViewCnt=40`;

        try {
          const html = await fetchProxiedHtml(searchUrl, 'utf-8');
          let books = parseKyoboDom(html, library, searchUrl);

          if (books.length === 0 && schDvsn !== '000') {
            const fallbackUrl = `${base}/search/searchList.ink?schDvsn=000&schTxt=${encodeURIComponent(query)}&selViewCnt=40`;
            const fallbackHtml = await fetchProxiedHtml(fallbackUrl, 'utf-8');
            books = parseKyoboDom(fallbackHtml, library, fallbackUrl);
          }

          const availableCount = books.filter(
            (b) => b.status === 'available' || b.status === 'subscription_available'
          ).length;

          return {
            books,
            summary: {
              libraryId: library.id,
              libraryName: library.name,
              resultCount: books.length,
              availableCount,
              status: 'ok',
            },
          };
        } catch (err) {
          return {
            books: [],
            summary: {
              libraryId: library.id,
              libraryName: library.name,
              resultCount: 0,
              availableCount: 0,
              status: 'error',
              errorMessage: err instanceof Error ? err.message : '검색 연결 오류',
            },
          };
        }
      }

      function parseGangnamDom(html, library) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const base = library.baseUrl.replace(/\/$/, '');
        const results = [];

        doc.querySelectorAll('.book').forEach((el) => {
          if (el.querySelector('.book')) return;
          const titleLink = el.querySelector('.book_title a');
          const title = cleanText(titleLink ? titleLink.textContent : '');
          if (!title) return;

          const href = (titleLink && titleLink.getAttribute('href')) || '';
          const detailUrl = href.startsWith('http')
            ? href
            : `${base}/elibbook/${href.replace(/^\//, '')}`;

          const imgEl = el.querySelector('.book_frame img');
          const coverUrl = normalizeDirectCoverUrl(
            imgEl ? imgEl.getAttribute('src') : '',
            base
          );

          const writerEl = el.querySelector('.writer');
          const author = cleanText(writerEl ? writerEl.textContent : '') || '저자 미상';
          const pubEl = el.querySelector('.publish_date');
          const pubRaw = cleanText(pubEl ? pubEl.textContent : '');
          const pubParts = pubRaw.split('·').map((s) => s.trim());
          const publisher = pubParts[0] || '출판사 정보 없음';
          const publishDate = pubParts[1] || '';

          const currents = Array.from(el.querySelectorAll('.current')).map((c) =>
            cleanText(c.textContent)
          );
          const vendor = currents[0] || '전자책';
          const countsLine = currents.find((c) => c.includes('보유')) || '';
          const countMatch = countsLine.match(/보유\s*(\d+).*?대출\s*(\d+).*?예약\s*(\d+)/);

          let totalCopies;
          let loanedCopies;
          let reservedCount;
          let availableCopies;
          let status = 'available';

          if (countMatch) {
            totalCopies = parseInt(countMatch[1], 10);
            loanedCopies = parseInt(countMatch[2], 10);
            reservedCount = parseInt(countMatch[3], 10);
            availableCopies = Math.max(0, totalCopies - loanedCopies);
            status = availableCopies > 0 ? 'available' : 'loaned';
          }

          const infoEl = el.querySelector('.info_text');
          const description = cleanText(infoEl ? infoEl.textContent : '');

          results.push({
            libraryId: library.id,
            title,
            author,
            publisher,
            publishDate,
            description,
            coverUrl,
            detailUrl,
            vendor,
            format: '전자책',
            status,
            totalCopies,
            loanedCopies,
            availableCopies,
            reservedCount,
          });
        });

        return results;
      }

      async function searchGangnamLibraryClient(library, query, field) {
        const base = library.baseUrl.replace(/\/$/, '');
        try {
          const fetchSingle = async (param) => {
            const url = `${base}/elibbook/book_info.asp?search=${param}&strSearch=${encodeEucKrQuery(query)}`;
            const html = await fetchProxiedHtml(url, 'euc-kr');
            return parseGangnamDom(html, library);
          };

          let books = [];
          if (field === 'title') {
            books = await fetchSingle('title');
          } else if (field === 'author') {
            books = await fetchSingle('author');
          } else {
            const [byTitle, byAuthor] = await Promise.all([
              fetchSingle('title'),
              fetchSingle('author'),
            ]);
            const seen = new Set();
            for (const b of [...byAuthor, ...byTitle]) {
              const key = `${b.detailUrl}|${b.title}`;
              if (!seen.has(key)) {
                seen.add(key);
                books.push(b);
              }
            }
          }

          const availableCount = books.filter(
            (b) => b.status === 'available' || b.status === 'subscription_available'
          ).length;

          return {
            books,
            summary: {
              libraryId: library.id,
              libraryName: library.name,
              resultCount: books.length,
              availableCount,
              status: 'ok',
            },
          };
        } catch (err) {
          return {
            books: [],
            summary: {
              libraryId: library.id,
              libraryName: library.name,
              resultCount: 0,
              availableCount: 0,
              status: 'error',
              errorMessage: err instanceof Error ? err.message : '검색 연결 오류',
            },
          };
        }
      }

      function normalizeBookKey(title, author) {
        const cleanTitle = title
          .replace(/\[.*?\]/g, '')
          .replace(/\(.*?(전자책|무선\s*보급판|리커버|특별판|개정판).*?\)/gi, '')
          .replace(/[:\-·.,!?'"“”‘’\s]/g, '')
          .toLowerCase();

        const firstAuthor = author
          .split(/[,/·]/)[0]
          .replace(/\(.*?\)/g, '')
          .replace(/(지음|글|저|역|옮김)/g, '')
          .replace(/\s+/g, '')
          .toLowerCase();

        return `${cleanTitle}__${firstAuthor.slice(0, 6)}`;
      }

      function statusPriority(status) {
        switch (status) {
          case 'available': return 6;
          case 'subscription_available': return 5;
          case 'loaned': return 4;
          case 'login_required': return 3;
          case 'external_link': return 2;
          case 'not_held': return 1;
          default: return 0;
        }
      }

      function buildLibraryDirectSearchUrl(library, query) {
        if (library.searchUrlTemplate) {
          return library.searchUrlTemplate.replace('{query}', encodeURIComponent(query));
        }
        const base = library.baseUrl.replace(/\/$/, '');
        if (library.adapter === 'gangnam-asp') {
          return `${base}/elibbook/book_info.asp?search=title&strSearch=${encodeEucKrQuery(query)}`;
        }
        if (library.adapter === 'kyobo-elibrary' || library.adapter === 'kyobo-root') {
          return `${base}/search/searchList.ink?schDvsn=000&schTxt=${encodeURIComponent(query)}`;
        }
        return base;
      }

      async function searchLibrariesStandalone(query, field, libraries) {
        const trimmed = query.trim();
        const activeLibraries = libraries.filter((l) => l.enabled);

        if (!trimmed || activeLibraries.length === 0) {
          return {
            query: trimmed,
            field,
            searchedAt: new Date().toISOString(),
            books: [],
            librarySummaries: [],
          };
        }

        // If served alongside backend /api/search, use backend directly
        if (
          typeof window !== 'undefined' &&
          window.location.protocol.startsWith('http') &&
          !window.location.hostname.endsWith('github.io')
        ) {
          try {
            const apiRes = await fetch('/api/search', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query: trimmed, field, libraries }),
            });
            if (apiRes.ok) {
              return await apiRes.json();
            }
          } catch {
            // Fall through to pure client-side search
          }
        }

        const libraryResults = await Promise.all(
          activeLibraries.map(async (lib) => {
            if (lib.adapter === 'kyobo-elibrary' || lib.adapter === 'kyobo-root') {
              return searchKyoboLibraryClient(lib, trimmed, field);
            }
            if (lib.adapter === 'gangnam-asp') {
              return searchGangnamLibraryClient(lib, trimmed, field);
            }
            if (lib.adapter === 'kyobo-subscription') {
              return {
                books: [],
                summary: {
                  libraryId: lib.id,
                  libraryName: lib.name,
                  resultCount: 0,
                  availableCount: 0,
                  status: 'auth_required',
                },
              };
            }
            return {
              books: [],
              summary: {
                libraryId: lib.id,
                libraryName: lib.name,
                resultCount: 0,
                availableCount: 0,
                status: 'external',
              },
            };
          })
        );

        const bookMap = new Map();
        for (const res of libraryResults) {
          for (const book of res.books) {
            const key = normalizeBookKey(book.title, book.author);
            let entry = bookMap.get(key);
            if (!entry) {
              entry = { canonical: book, byLibrary: new Map() };
              bookMap.set(key, entry);
            } else {
              if (!entry.canonical.coverUrl && book.coverUrl) {
                entry.canonical.coverUrl = book.coverUrl;
              }
              if (book.description.length > entry.canonical.description.length) {
                entry.canonical.description = book.description;
              }
            }
            const libList = entry.byLibrary.get(book.libraryId) || [];
            libList.push(book);
            entry.byLibrary.set(book.libraryId, libList);
          }
        }

        const summaryMap = new Map(
          libraryResults.map((r) => [r.summary.libraryId, r.summary])
        );

        const aggregatedBooks = [];
        for (const [key, entry] of bookMap.entries()) {
          const availabilities = activeLibraries.map((lib) => {
            const libSummary = summaryMap.get(lib.id);
            const matches = entry.byLibrary.get(lib.id);

            if (matches && matches.length > 0) {
              const sorted = [...matches].sort(
                (a, b) =>
                  statusPriority(b.status) - statusPriority(a.status) ||
                  (b.availableCopies ?? 0) - (a.availableCopies ?? 0)
              );
              const best = sorted[0];
              return {
                libraryId: lib.id,
                libraryName: lib.name,
                category: lib.category,
                status: best.status,
                totalCopies: best.totalCopies,
                loanedCopies: best.loanedCopies,
                availableCopies: best.availableCopies,
                reservedCount: best.reservedCount,
                vendor: best.vendor,
                matchedTitle: best.title,
                detailUrl: best.detailUrl,
                editions: sorted.length > 1 ? sorted : undefined,
              };
            }

            if (lib.adapter === 'kyobo-subscription') {
              return {
                libraryId: lib.id,
                libraryName: lib.name,
                category: lib.category,
                status: 'login_required',
                detailUrl: buildLibraryDirectSearchUrl(lib, entry.canonical.title),
                note: '구독형 서비스는 정회원 로그인 후 도서관/교보 앱에서 즉시 대출 여부를 확인할 수 있습니다.',
              };
            }

            if (lib.adapter === 'custom-link') {
              return {
                libraryId: lib.id,
                libraryName: lib.name,
                category: lib.category,
                status: 'external_link',
                detailUrl: buildLibraryDirectSearchUrl(lib, entry.canonical.title),
                note: '외부 도서관 검색 페이지로 이동해 소장 여부를 확인하세요.',
              };
            }

            if (libSummary && libSummary.status === 'error') {
              return {
                libraryId: lib.id,
                libraryName: lib.name,
                category: lib.category,
                status: 'error',
                detailUrl: buildLibraryDirectSearchUrl(lib, entry.canonical.title),
                note: `조회 실패 (${libSummary.errorMessage || '네트워크 오류'})`,
              };
            }

            return {
              libraryId: lib.id,
              libraryName: lib.name,
              category: lib.category,
              status: 'not_held',
              detailUrl: buildLibraryDirectSearchUrl(lib, entry.canonical.title),
            };
          });

          const availableLibraryCount = availabilities.filter(
            (a) => a.status === 'available' || a.status === 'subscription_available'
          ).length;

          const heldLibraryCount = availabilities.filter(
            (a) =>
              a.status === 'available' ||
              a.status === 'subscription_available' ||
              a.status === 'loaned'
          ).length;

          aggregatedBooks.push({
            id: key,
            title: entry.canonical.title,
            author: entry.canonical.author,
            publisher: entry.canonical.publisher,
            publishDate: entry.canonical.publishDate,
            description: entry.canonical.description,
            coverUrl: entry.canonical.coverUrl,
            format: entry.canonical.format || '전자책',
            availableLibraryCount,
            heldLibraryCount,
            availabilities,
          });
        }

        // If all live-searchable libraries returned network/CORS errors (e.g. strict file:// blocking),
        // surface a clean direct-search card so the user can still jump straight to every library!
        const allFailed =
          aggregatedBooks.length === 0 &&
          libraryResults.some((r) => r.summary.status === 'error');

        if (allFailed) {
          aggregatedBooks.push({
            id: `direct-query-${trimmed}`,
            title: `"${trimmed}" 도서관별 직접 검색`,
            author: '가입 도서관 통합 바로가기',
            publisher: `${activeLibraries.length}개 도서관 검색 링크`,
            publishDate: '',
            description:
              '현재 실행 환경의 브라우저 보안 정책(CORS)으로 실시간 자동 수집이 제한되어, 각 전자도서관의 검색 페이지로 바로 이동할 수 있도록 연결합니다.',
            coverUrl: '',
            format: '바로가기',
            availableLibraryCount: 0,
            heldLibraryCount: 0,
            availabilities: activeLibraries.map((lib) => ({
              libraryId: lib.id,
              libraryName: lib.name,
              category: lib.category,
              status:
                lib.adapter === 'kyobo-subscription'
                  ? 'login_required'
                  : 'external_link',
              detailUrl: buildLibraryDirectSearchUrl(lib, trimmed),
              note:
                lib.adapter === 'kyobo-subscription'
                  ? '정회원 로그인 후 구독형 메뉴에서 바로 대출할 수 있습니다.'
                  : `"${trimmed}" 검색 결과 페이지로 이동해 대출 가능 여부를 확인하세요.`,
            })),
          });
        }

        const lowerQuery = trimmed.toLowerCase();
        aggregatedBooks.sort((a, b) => {
          const aExact =
            a.title.toLowerCase().includes(lowerQuery) ||
            a.author.toLowerCase().includes(lowerQuery)
              ? 1
              : 0;
          const bExact =
            b.title.toLowerCase().includes(lowerQuery) ||
            b.author.toLowerCase().includes(lowerQuery)
              ? 1
              : 0;
          if (aExact !== bExact) return bExact - aExact;
          if (a.availableLibraryCount !== b.availableLibraryCount) {
            return b.availableLibraryCount - a.availableLibraryCount;
          }
          return b.heldLibraryCount - a.heldLibraryCount;
        });

        return {
          query: trimmed,
          field,
          searchedAt: new Date().toISOString(),
          books: aggregatedBooks,
          librarySummaries: libraryResults.map((r) => r.summary),
        };
      }

      const IGNORED_WEB_HOSTS = [
        'naver.com', 'daum.net', 'kakao.com', 'tistory.com', 'youtube.com',
        'youtu.be', 'google.com', 'namu.wiki', 'wikipedia.org', 'instagram.com',
        'facebook.com', 'x.com', 'twitter.com', 'play.google.com', 'apps.apple.com',
        'yes24.com', 'aladin.co.kr', 'www.kyobobook.co.kr', 'brunch.co.kr',
        'velog.io', 'visitkorea.or.kr',
      ];

      function sanitizeLibraryName(raw) {
        return (raw || '')
          .replace(/새\s*창\s*열림/g, '')
          .replace(/\s*[-|:]\s*(홈페이지|메인|안내).*$/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      function isRelevantLibraryHost(hostname) {
        const lower = hostname.toLowerCase();
        if (IGNORED_WEB_HOSTS.some((bad) => lower === bad || lower.endsWith(`.${bad}`))) {
          return false;
        }
        return (
          lower.includes('lib') ||
          lower.includes('ebook') ||
          lower.includes('elib') ||
          lower.includes('book') ||
          lower.includes('dkyobobook') ||
          lower.includes('bookcube') ||
          lower.includes('nanet')
        );
      }

      async function discoverLibrariesStandalone(query) {
        const trimmed = query.trim();
        const catalog = [...PRESET_LIBRARIES, ...DEFAULT_LIBRARIES].filter(
          (item, index, self) => self.findIndex((x) => x.id === item.id) === index
        );

        const toCandidate = (lib) => {
          const isRealtime =
            lib.adapter === 'kyobo-elibrary' ||
            lib.adapter === 'kyobo-root' ||
            lib.adapter === 'gangnam-asp';
          return {
            library: { ...lib, enabled: true },
            supportLevel: isRealtime ? 'realtime' : 'link',
            supportLabel: isRealtime
              ? '실시간 대출여부 조회 지원'
              : lib.adapter === 'kyobo-subscription'
                ? '구독형 로그인 연동'
                : '외부 도서관 검색 연동',
            source: 'directory',
          };
        };

        if (!trimmed) {
          return catalog.map(toCandidate);
        }

        // Try backend if hosted alongside server.ts
        if (
          typeof window !== 'undefined' &&
          window.location.protocol.startsWith('http') &&
          !window.location.hostname.endsWith('github.io')
        ) {
          try {
            const res = await fetch(`/api/discover-libraries?q=${encodeURIComponent(trimmed)}`);
            if (res.ok) {
              const data = await res.json();
              if (Array.isArray(data.candidates)) return data.candidates;
            }
          } catch {
            // Fall through to client discovery
          }
        }

        const normQ = trimmed.replace(/\s+/g, '').toLowerCase();
        const directoryMatches = catalog
          .filter((lib) => {
            const hay = `${lib.name} ${lib.shortName} ${lib.description || ''}`
              .replace(/\s+/g, '')
              .toLowerCase();
            return hay.includes(normQ);
          })
          .map(toCandidate);

        const seenOrigins = new Set();
        for (const m of directoryMatches) {
          try {
            seenOrigins.add(new URL(m.library.baseUrl).origin);
          } catch {}
        }

        const webMatches = [];
        try {
          const searchKeyword = trimmed.includes('도서관') ? trimmed : `${trimmed} 전자도서관`;
          const searchUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(searchKeyword)}`;
          const html = await fetchProxiedHtml(searchUrl, 'utf-8', 9000);
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const candidateMap = new Map();

          doc.querySelectorAll('a[href^="http"]').forEach((el) => {
            const href = el.getAttribute('href') || '';
            try {
              const parsed = new URL(href);
              if (!isRelevantLibraryHost(parsed.hostname)) return;
              if (seenOrigins.has(parsed.origin) || candidateMap.has(parsed.origin)) return;
              const anchorText = sanitizeLibraryName(cleanText(el.textContent));
              const scoreBoost =
                parsed.hostname.includes('ebook') ||
                parsed.hostname.includes('elib') ||
                parsed.hostname.includes('dkyobobook');
              if (scoreBoost || anchorText.includes('도서관')) {
                const label =
                  anchorText.length >= 2 && anchorText.length <= 32
                    ? anchorText
                    : searchKeyword;
                candidateMap.set(parsed.origin, label);
              }
            } catch {}
          });

          const sortedOrigins = Array.from(candidateMap.entries())
            .sort((a, b) => {
              const aScore = /ebook|elib|dkyobobook|book/i.test(a[0]) ? 1 : 0;
              const bScore = /ebook|elib|dkyobobook|book/i.test(b[0]) ? 1 : 0;
              return bScore - aScore;
            })
            .slice(0, 3);

          const probed = await Promise.all(
            sortedOrigins.map(async ([origin, label]) => {
              const kyoboList = [
                { adapter: 'kyobo-elibrary', baseUrl: `${origin}/elibrary-front` },
                { adapter: 'kyobo-root', baseUrl: origin },
              ];
              for (const cand of kyoboList) {
                try {
                  const testUrl = `${cand.baseUrl}/search/searchList.ink?schDvsn=000&schTxt=${encodeURIComponent('책')}`;
                  const kHtml = await fetchProxiedHtml(testUrl, 'utf-8', 7000);
                  if (kHtml.includes('book_resultList')) {
                    const kDoc = new DOMParser().parseFromString(kHtml, 'text/html');
                    const metaTitle = sanitizeLibraryName(
                      cleanText(kDoc.querySelector('meta[name="title"]')?.getAttribute('content') || '') ||
                        cleanText((kDoc.querySelector('title')?.textContent || '').split('|').pop())
                    );
                    const finalName = metaTitle && metaTitle.length >= 2 ? metaTitle : label;
                    return {
                      library: {
                        id: `web-${origin.replace(/[^a-z0-9]/gi, '-')}`,
                        name: finalName,
                        shortName: finalName.replace(/\s*전자도서관.*$/, '').slice(0, 8) || finalName.slice(0, 8),
                        category: 'owned',
                        adapter: cand.adapter,
                        baseUrl: cand.baseUrl,
                        enabled: true,
                        description: `${finalName} (실시간 소장·대출 조회)`,
                      },
                      supportLevel: 'realtime',
                      supportLabel: '실시간 대출여부 조회 지원',
                      source: 'web',
                    };
                  }
                } catch {}
              }

              return {
                library: {
                  id: `web-${origin.replace(/[^a-z0-9]/gi, '-')}`,
                  name: label,
                  shortName: label.replace(/\s*전자도서관.*$/, '').slice(0, 8) || label.slice(0, 8),
                  category: label.includes('구독') ? 'subscription' : 'owned',
                  adapter: 'custom-link',
                  baseUrl: origin,
                  enabled: true,
                  description: `${new URL(origin).hostname} 공식 전자도서관`,
                },
                supportLevel: 'link',
                supportLabel: '공식 도서관 링크 연동',
                source: 'web',
              };
            })
          );

          for (const item of probed) {
            if (item) webMatches.push(item);
          }
        } catch {
          // Directory results still return cleanly
        }

        return [...directoryMatches, ...webMatches];
      }

      async function testCustomLibraryConnectionClient(baseUrl, adapter) {
        const normalized = baseUrl.trim().replace(/\/$/, '');
        if (!normalized.startsWith('http://') && !normalized.startsWith('https://')) {
          return {
            ok: false,
            sampleCount: 0,
            message: 'http:// 또는 https:// 로 시작하는 주소를 입력해 주세요.',
          };
        }

        if (adapter === 'custom-link' || adapter === 'kyobo-subscription') {
          return {
            ok: true,
            detectedAdapter: adapter,
            sampleCount: 0,
            message: '외부 검색 / 로그인 연동 방식으로 등록할 수 있습니다.',
          };
        }

        const candidates =
          adapter === 'kyobo-root'
            ? [
                { adapter: 'kyobo-root', url: normalized },
                { adapter: 'kyobo-elibrary', url: `${normalized}/elibrary-front` },
              ]
            : [
                {
                  adapter: 'kyobo-elibrary',
                  url: normalized.endsWith('/elibrary-front')
                    ? normalized
                    : `${normalized}/elibrary-front`,
                },
                { adapter: 'kyobo-root', url: normalized },
              ];

        for (const candidate of candidates) {
          try {
            const testUrl = `${candidate.url}/search/searchList.ink?schDvsn=000&schTxt=${encodeURIComponent('책')}`;
            const html = await fetchProxiedHtml(testUrl, 'utf-8', 8000);
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const count = doc.querySelectorAll('.book_resultList > li').length;
            if (html.includes('book_resultList') || count > 0) {
              return {
                ok: true,
                detectedAdapter: candidate.adapter,
                sampleCount: count,
                message: `실시간 검색 연동 확인 완료 (테스트 검색 ${count}건)`,
              };
            }
          } catch {}
        }

        return {
          ok: false,
          sampleCount: 0,
          message: '교보문고 전자도서관 검색 페이지에 연결할 수 없습니다. 외부 검색 링크 방식으로 등록할 수 있습니다.',
        };
      }

              : '';
          return `잔여 ${remaining}권 (대출 ${item.loanedCopies}/${item.totalCopies}${reserveText})`;

        return null;
