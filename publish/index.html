        const [searchError, setSearchError] = useState(null);

        const [name, setName] = useState('');
        const [baseUrl, setBaseUrl] = useState('');
        const [category, setCategory] = useState('owned');
        const [adapter, setAdapter] = useState('kyobo-elibrary');
        const [searchTemplate, setSearchTemplate] = useState('');
        const [testing, setTesting] = useState(false);
        const [testResult, setTestResult] = useState(null);

        const localCatalog = useMemo(() => {
          const merged = [...PRESET_LIBRARIES, ...DEFAULT_LIBRARIES].filter(
            (item, index, self) => self.findIndex((x) => x.id === item.id) === index
          );
          return merged.map((lib) => {
            const isRealtime =
              lib.adapter === 'kyobo-elibrary' ||
              lib.adapter === 'kyobo-root' ||
              lib.adapter === 'gangnam-asp';
            return {
              library: { ...lib, enabled: true },
              supportLevel: isRealtime ? 'realtime' : 'link',
              supportLabel: isRealtime
                ? '실시간 대출여부 조회 지원'
                : lib.adapter === 'kyobo-subscription'
                  ? '구독형 로그인 연동'
                  : '외부 도서관 검색 연동',
              source: 'directory',
            };
          });
        }, []);

        const filteredLocal = useMemo(() => {
          const trimmed = searchQuery.trim().replace(/\s+/g, '').toLowerCase();
          if (!trimmed) return localCatalog;
          return localCatalog.filter((item) => {
            const hay = `${item.library.name} ${item.library.shortName} ${item.library.description || ''}`
              .replace(/\s+/g, '')
              .toLowerCase();
            return hay.includes(trimmed);
          });
        }, [localCatalog, searchQuery]);

        const runLibraryDiscovery = useCallback(async (keyword) => {
          const trimmed = keyword.trim();
          if (!trimmed) {
            setWebCandidates([]);
            setHasQueriedWeb(false);
            setSearchError(null);
            return;
          }

          setIsSearching(true);
          setSearchError(null);

          try {
            const candidates = await discoverLibrariesStandalone(trimmed);
            setWebCandidates(candidates);
            setHasQueriedWeb(true);
          } catch {
            setSearchError('도서관 검색 중 일시적인 오류가 발생했습니다.');
          } finally {
            setIsSearching(false);
          }
        }, []);

        useEffect(() => {
          if (!isOpen || activeTab !== 'search') return;
          const trimmed = searchQuery.trim();
          if (trimmed.length < 2) {
            setWebCandidates([]);
            setHasQueriedWeb(false);
            return;
          }
          const timer = setTimeout(() => {
            runLibraryDiscovery(trimmed);
          }, 450);
          return () => clearTimeout(timer);
        }, [searchQuery, isOpen, activeTab, runLibraryDiscovery]);

        if (!isOpen) return null;

        const existingIds = new Set(libraries.map((l) => l.id));
        const existingUrls = new Set(
          libraries.map((l) => l.baseUrl.replace(/\/$/, '').toLowerCase())
        );

        function isAlreadyAdded(lib) {
          if (existingIds.has(lib.id)) return true;
          return existingUrls.has(lib.baseUrl.replace(/\/$/, '').toLowerCase());
        }

        const displayedCandidates = (() => {
          if (!searchQuery.trim()) return localCatalog;
          if (hasQueriedWeb && webCandidates.length > 0) {
            const seen = new Set(webCandidates.map((c) => c.library.id));
            return [
              ...webCandidates,
              ...filteredLocal.filter((c) => !seen.has(c.library.id)),
            ];
          }
          return filteredLocal;
        })();

        function handleSearchSubmit(e) {
          e.preventDefault();
          runLibraryDiscovery(searchQuery);
        }

        async function handleTestConnection() {
          if (!baseUrl.trim()) return;
          setTesting(true);
          setTestResult(null);
          try {
            const data = await testCustomLibraryConnectionClient(
              baseUrl.trim(),
              adapter
            );
            setTestResult(data);
            if (data.ok && data.detectedAdapter) {
              setAdapter(data.detectedAdapter);
            }
          } catch {
            setTestResult({
              ok: false,
              message: '연결 테스트 요청에 실패했습니다.',
            });
          } finally {
            setTesting(false);
          }
        }

        function handleCustomSubmit(e) {
          e.preventDefault();
          if (!name.trim() || !baseUrl.trim()) return;

          let cleanUrl = baseUrl.trim().replace(/\/$/, '');
          if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
            cleanUrl = `https://${cleanUrl}`;
          }
          if (
            adapter === 'kyobo-elibrary' &&
            !cleanUrl.endsWith('/elibrary-front')
          ) {
            cleanUrl = `${cleanUrl}/elibrary-front`;
          }

          const newLib = {
            id: `custom-${Date.now()}`,
            name: name.trim(),
            shortName: name.trim().slice(0, 8),
            category,
            adapter,
            baseUrl: cleanUrl,
            searchUrlTemplate:
              adapter === 'custom-link' && searchTemplate.trim()
                ? searchTemplate.trim()
                : undefined,
            enabled: true,
            description:
              adapter === 'custom-link'
                ? '사용자 지정 검색 링크 연동'
                : '사용자 추가 전자도서관',
          };

          onAddLibrary(newLib);
          setName('');
          setBaseUrl('');
          setSearchTemplate('');
          setTestResult(null);
          onClose();
        }

        return (
          <div
            className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/45 p-3 sm:p-4"
            role="dialog"
            aria-modal="true"
            aria-labelledby="add-library-title"
          >
            <div className="w-full max-w-xl bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden flex flex-col max-h-[90dvh]">
              <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
                <div>
                  <h2
                    id="add-library-title"
                    className="text-base font-bold text-slate-900"
                  >
                    전자도서관 검색 · 추가
                  </h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    도서관 이름만 입력하면 자동으로 전자도서관 주소를 찾아 추가합니다.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={onClose}
                  aria-label="창 닫기"
                  className="min-w-[40px] min-h-[40px] flex items-center justify-center shrink-0 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg"
                >
                  <XIcon className="w-5 h-5" />
                </button>
              </div>

              <div className="px-5 pt-3 border-b border-slate-100 flex gap-2">
                <button
                  type="button"
                  onClick={() => setActiveTab('search')}
                  className={`px-3 py-2 text-xs font-semibold border-b-2 transition-colors whitespace-nowrap ${
                    activeTab === 'search'
                      ? 'border-blue-700 text-blue-700'
                      : 'border-transparent text-slate-500 hover:text-slate-800'
                  }`}
                >
                  도서관 명으로 검색
                </button>
                <button
                  type="button"
                  onClick={() => setActiveTab('custom')}
                  className={`px-3 py-2 text-xs font-semibold border-b-2 transition-colors whitespace-nowrap ${
                    activeTab === 'custom'
                      ? 'border-blue-700 text-blue-700'
                      : 'border-transparent text-slate-500 hover:text-slate-800'
                  }`}
                >
                  직접 URL로 추가
                </button>
              </div>

              <div className="p-5 overflow-y-auto overscroll-contain [-webkit-overflow-scrolling:touch] flex-1 flex flex-col gap-4">
                {activeTab === 'search' ? (
                  <>
                    <form onSubmit={handleSearchSubmit} className="flex gap-2">
                      <div className="relative flex-1 flex items-center border border-slate-300 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-600 focus-within:border-blue-600">
                        <SearchIcon className="w-4 h-4 text-slate-400 ml-3 shrink-0" />
                        <label htmlFor="discover-library-input" className="sr-only">
                          도서관 이름 검색
                        </label>
                        <input
                          id="discover-library-input"
                          type="search"
                          enterKeyHint="search"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="도서관 명을 입력하세요 (예: 용인시, 송파구, 부산, 성남시)"
                          className="w-full px-3 py-2.5 text-[16px] sm:text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none"
                        />
                        {searchQuery && (
                          <button
                            type="button"
                            onClick={() => {
                              setSearchQuery('');
                              setWebCandidates([]);
                              setHasQueriedWeb(false);
                            }}
                            aria-label="검색어 지우기"
                            className="p-2 mr-1 text-slate-400 hover:text-slate-700 rounded"
                          >
                            <XIcon className="w-3.5 h-3.5" />
                          </button>
                        )}
                      </div>
                      <button
                        type="submit"
                        disabled={isSearching || !searchQuery.trim()}
                        className="px-4 py-2 min-h-[44px] sm:min-h-0 rounded-lg bg-slate-900 text-white text-xs font-semibold hover:bg-blue-700 disabled:opacity-50 transition-colors whitespace-nowrap shrink-0 flex items-center gap-1.5"
                      >
                        {isSearching && (
                          <Loader2Icon className="w-3.5 h-3.5 animate-spin" />
                        )}
                        <span>검색</span>
                      </button>
                    </form>

                    <div className="flex flex-wrap items-center gap-1.5 text-xs">
                      <span className="text-slate-500">빠른 찾기:</span>
                      {SUGGESTED_LIBRARY_TERMS.map((term) => (
                        <button
                          key={term}
                          type="button"
                          onClick={() => {
                            setSearchQuery(term);
                            runLibraryDiscovery(term);
                          }}
                          className={`px-2.5 py-1 rounded-md transition-colors whitespace-nowrap ${
                            searchQuery === term
                              ? 'bg-blue-50 text-blue-700 font-semibold'
                              : 'bg-slate-100 text-slate-700 hover:bg-slate-200/70'
                          }`}
                        >
                          {term}
                        </button>
                      ))}
                    </div>

                    {searchError && (
                      <p className="text-xs text-rose-600">{searchError}</p>
                    )}

                    {isSearching && displayedCandidates.length === 0 ? (
                      <div className="py-10 flex flex-col items-center justify-center text-center gap-2 text-xs text-slate-500 border border-slate-200 rounded-lg">
                        <Loader2Icon className="w-5 h-5 animate-spin text-blue-700" />
                        <span>
                          &ldquo;{searchQuery}&rdquo; 공식 전자도서관 주소를 검색하고 있습니다...
                        </span>
                      </div>
                    ) : displayedCandidates.length === 0 ? (
                      <div className="py-10 px-4 text-center border border-slate-200 rounded-lg">
                        <p className="text-sm font-semibold text-slate-900">
                          일치하는 전자도서관을 찾지 못했습니다
                        </p>
                        <p className="text-xs text-slate-500 mt-1">
                          도서관 전체 이름(예: OO구 전자도서관, OO시립도서관)으로 검색하거나, 상단 &lsquo;직접 URL로 추가&rsquo; 탭에서 주소를 등록할 수 있습니다.
                        </p>
                      </div>
                    ) : (
                      <div className="flex flex-col gap-2">
                        <div className="flex items-center justify-between text-xs text-slate-500">
                          <span>
                            {searchQuery.trim()
                              ? `검색 결과 ${displayedCandidates.length}곳`
                              : `주요 추천 전자도서관 ${displayedCandidates.length}곳`}
                          </span>
                          {isSearching && (
                            <span className="inline-flex items-center gap-1 text-blue-700">
                              <Loader2Icon className="w-3 h-3 animate-spin" />
                              웹에서 추가 탐색 중...
                            </span>
                          )}
                        </div>

                        <ul className="divide-y divide-slate-100 border border-slate-200 rounded-lg overflow-hidden">
                          {displayedCandidates.map((item) => {
                            const lib = item.library;
                            const added = isAlreadyAdded(lib);
                            let hostname = lib.baseUrl;
                            try {
                              hostname = new URL(lib.baseUrl).hostname;
                            } catch {}

                            return (
                              <li
                                key={`${lib.id}-${lib.baseUrl}`}
                                className="px-4 py-3 flex items-center justify-between gap-3 bg-white hover:bg-slate-50/60 transition-colors"
                              >
                                <div className="min-w-0 flex-1">
                                  <div className="flex items-center gap-2 flex-wrap">
                                    <span className="text-sm font-semibold text-slate-900 truncate">
                                      {lib.name}
                                    </span>
                                    <span
                                      className={`text-[11px] font-medium ${
                                        item.supportLevel === 'realtime'
                                          ? 'text-emerald-700'
                                          : 'text-slate-500'
                                      }`}
                                    >
                                      {item.supportLabel}
                                    </span>
                                  </div>
                                  <div className="text-xs text-slate-500 mt-0.5 flex items-center gap-1.5 truncate">
                                    <GlobeIcon className="w-3 h-3 shrink-0 text-slate-400" />
                                    <span className="truncate">{hostname}</span>
                                    {lib.description && (
                                      <>
                                        <span aria-hidden="true">·</span>
                                        <span className="truncate">
                                          {lib.description}
                                        </span>
                                      </>
                                    )}
                                  </div>
                                </div>

                                {added ? (
                                  <span className="inline-flex items-center gap-1 text-xs font-medium text-emerald-700 px-2.5 py-1.5 whitespace-nowrap shrink-0">
                                    <CheckIcon className="w-3.5 h-3.5" />
                                    추가됨
                                  </span>
                                ) : (
                                  <button
                                    type="button"
                                    onClick={() =>
                                      onAddLibrary({ ...lib, enabled: true })
                                    }
                                    className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium hover:bg-blue-700 transition-colors whitespace-nowrap shrink-0"
                                  >
                                    <PlusIcon className="w-3.5 h-3.5" />
                                    추가
                                  </button>
                                )}
                              </li>
                            );
                          })}
                        </ul>
                      </div>
                    )}
                  </>
                ) : (
                  <form onSubmit={handleCustomSubmit} className="flex flex-col gap-4">
                    <div>
                      <label
                        htmlFor="lib-name"
                        className="block text-xs font-semibold text-slate-700 mb-1.5"
                      >
                        도서관 이름
                      </label>
                      <input
                        id="lib-name"
                        type="text"
                        required
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        placeholder="예: 성남시 전자도서관, 사내 전자도서관"
                        className="w-full px-3 py-2 text-[16px] sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label
                          htmlFor="lib-category"
                          className="block text-xs font-semibold text-slate-700 mb-1.5"
                        >
                          운영 방식
                        </label>
                        <select
                          id="lib-category"
                          value={category}
                          onChange={(e) => setCategory(e.target.value)}
                          className="w-full px-3 py-2 text-[16px] sm:text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                        >
                          <option value="owned">소장형 전자책</option>
                          <option value="subscription">구독형 전자책</option>
                        </select>
                      </div>

                      <div>
                        <label
                          htmlFor="lib-adapter"
                          className="block text-xs font-semibold text-slate-700 mb-1.5"
                        >
                          연동 플랫폼
                        </label>
                        <select
                          id="lib-adapter"
                          value={adapter}
                          onChange={(e) => setAdapter(e.target.value)}
                          className="w-full px-3 py-2 text-[16px] sm:text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-600"
                        >
                          <option value="kyobo-elibrary">
                            교보문고 (/elibrary-front)
                          </option>
                          <option value="kyobo-root">교보문고 (독립 도메인)</option>
                          <option value="kyobo-subscription">
                            구독형 (로그인 연동)
                          </option>
                          <option value="custom-link">외부 검색 링크</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label
                        htmlFor="lib-url"
                        className="block text-xs font-semibold text-slate-700 mb-1.5"
                      >
                        도서관 웹 주소 (URL)
                      </label>
                      <div className="flex gap-2">
                        <input
                          id="lib-url"
                          type="url"
                          required
                          value={baseUrl}
                          onChange={(e) => setBaseUrl(e.target.value)}
                          placeholder="https://ebook.example.go.kr"
                          className="flex-1 px-3 py-2 text-[16px] sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                        />
                        {adapter !== 'custom-link' &&
                          adapter !== 'kyobo-subscription' && (
                            <button
                              type="button"
                              onClick={handleTestConnection}
                              disabled={testing || !baseUrl.trim()}
                              className="px-3 py-2 min-h-[44px] sm:min-h-0 text-xs font-medium border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 disabled:opacity-50 whitespace-nowrap shrink-0 flex items-center gap-1.5"
                            >
                              {testing && (
                                <Loader2Icon className="w-3.5 h-3.5 animate-spin" />
                              )}
                              연결 테스트
                            </button>
                          )}
                      </div>
                      {testResult && (
                        <p
                          className={`mt-1.5 text-xs flex items-center gap-1.5 ${
                            testResult.ok ? 'text-emerald-700' : 'text-amber-700'
                          }`}
                        >
                          {testResult.ok && (
                            <CheckCircle2Icon className="w-3.5 h-3.5 shrink-0" />
                          )}
                          <span>{testResult.message}</span>
                        </p>
                      )}
                    </div>

                    {adapter === 'custom-link' && (
                      <div>
                        <label
                          htmlFor="lib-template"
                          className="block text-xs font-semibold text-slate-700 mb-1.5"
                        >
                          검색 URL 템플릿 (선택)
                        </label>
                        <input
                          id="lib-template"
                          type="text"
                          value={searchTemplate}
                          onChange={(e) => setSearchTemplate(e.target.value)}
                          placeholder="https://lib.example.kr/search?q={query}"
                          className="w-full px-3 py-2 text-[16px] sm:text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600"
                        />
                        <p className="text-[11px] text-slate-500 mt-1">
                          {'{query}'} 위치에 선택한 도서 제목이 자동으로 입력됩니다.
                        </p>
                      </div>
                    )}

                    <div className="pt-2 flex items-center justify-end gap-2">
                      <button
                        type="button"
                        onClick={onClose}
                        className="px-4 py-2 min-h-[44px] sm:min-h-0 text-xs font-medium text-slate-600 hover:text-slate-900 rounded-lg"
                      >
                        취소
                      </button>
                      <button
                        type="submit"
                        className="px-4 py-2 min-h-[44px] sm:min-h-0 text-xs font-semibold bg-blue-700 text-white rounded-lg hover:bg-blue-800 transition-colors whitespace-nowrap"
                      >
                        도서관 추가하기
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          </div>
        );
      }

      const QUICK_KEYWORDS = [
        '한강',
        '불편한 편의점',
        '물고기는 존재하지 않는다',
        '모순',
        '아몬드',
        '트렌드 코리아',
      ];

      function App() {
        const [libraries, setLibraries] = useState(() => loadSavedLibraries());
        const [queryInput, setQueryInput] = useState('');
        const [activeQuery, setActiveQuery] = useState('');
        const [searchField, setSearchField] = useState('all');
        const [books, setBooks] = useState([]);
        const [summaries, setSummaries] = useState([]);
        const [selectedBookId, setSelectedBookId] = useState(null);
        const [mobileDetailOpen, setMobileDetailOpen] = useState(false);
        const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
        const [isAddModalOpen, setIsAddModalOpen] = useState(false);
        const [resultFilter, setResultFilter] = useState('all');
        const [sortOrder, setSortOrder] = useState('relevance');
        const [isLoading, setIsLoading] = useState(false);
        const [errorMessage, setErrorMessage] = useState(null);

        const searchTokenRef = useRef(0);
        const librarySectionRef = useRef(null);

        useEffect(() => {
          saveLibraries(libraries);
        }, [libraries]);

        const executeSearch = useCallback(
          async (targetQuery, targetField, targetLibraries) => {
            const trimmed = targetQuery.trim();
            if (!trimmed) {
              setBooks([]);
              setSummaries([]);
              setSelectedBookId(null);
              setActiveQuery('');
              return;
            }

            const token = ++searchTokenRef.current;
            setIsLoading(true);
            setErrorMessage(null);
            setActiveQuery(trimmed);

            try {
              const data = await searchLibrariesStandalone(
                trimmed,
                targetField,
                targetLibraries
              );
              if (token !== searchTokenRef.current) return;
              setBooks(data.books);
              setSummaries(data.librarySummaries);
              setSelectedBookId((prev) => {
                if (prev && data.books.some((b) => b.id === prev)) {
                  return prev;
                }
                return data.books[0]?.id ?? null;
              });
            } catch (err) {
              if (token !== searchTokenRef.current) return;
              setErrorMessage(
                err instanceof Error
                  ? err.message
                  : '도서관 서버와 통신 중 오류가 발생했습니다.'
              );
            } finally {
              if (token === searchTokenRef.current) {
                setIsLoading(false);
              }
            }
          },
          []
        );

        function handleSearchSubmit(e) {
          e.preventDefault();
          executeSearch(queryInput, searchField, libraries);
        }

        function handleQuickKeyword(keyword) {
          setQueryInput(keyword);
          executeSearch(keyword, searchField, libraries);
        }

        function handleToggleLibrary(id) {
          const updated = libraries.map((lib) =>
            lib.id === id ? { ...lib, enabled: !lib.enabled } : lib
          );
          setLibraries(updated);
          if (activeQuery) {
            executeSearch(activeQuery, searchField, updated);
          }
        }

        function handleRemoveLibrary(id) {
          const updated = libraries.filter((lib) => lib.id !== id);
          setLibraries(updated);
          if (activeQuery) {
            executeSearch(activeQuery, searchField, updated);
          }
        }

        function handleAddLibrary(newLib) {
          if (libraries.some((l) => l.id === newLib.id)) return;
          const updated = [...libraries, newLib];
          setLibraries(updated);
          if (activeQuery) {
            executeSearch(activeQuery, searchField, updated);
          }
        }

        function handleResetDefaults() {
          setLibraries(DEFAULT_LIBRARIES);
          if (activeQuery) {
            executeSearch(activeQuery, searchField, DEFAULT_LIBRARIES);
          }
        }

        const filteredAndSortedBooks = useMemo(() => {
          let list = books;
          if (resultFilter === 'available') {
            list = list.filter((b) => b.availableLibraryCount > 0);
          } else if (resultFilter === 'multi') {
            list = list.filter((b) => b.heldLibraryCount >= 2);
          }

          if (sortOrder === 'libraries') {
            return [...list].sort(
              (a, b) =>
                b.heldLibraryCount - a.heldLibraryCount ||
                b.availableLibraryCount - a.availableLibraryCount
            );
          }
          if (sortOrder === 'newest') {
            return [...list].sort((a, b) =>
              (b.publishDate || '').localeCompare(a.publishDate || '')
            );
          }
          return list;
        }, [books, resultFilter, sortOrder]);

        const selectedBook = useMemo(() => {
          if (!selectedBookId) return filteredAndSortedBooks[0] ?? null;
          return (
            filteredAndSortedBooks.find((b) => b.id === selectedBookId) ??
            books.find((b) => b.id === selectedBookId) ??
            filteredAndSortedBooks[0] ??
            null
          );
        }, [books, filteredAndSortedBooks, selectedBookId]);

        const availableBookCount = useMemo(
          () => books.filter((b) => b.availableLibraryCount > 0).length,
          [books]
        );

        const enabledLibrariesCount = libraries.filter((l) => l.enabled).length;

        return (
          <div className="min-h-[100dvh] flex flex-col bg-slate-50 text-slate-900">
            <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-sm border-b border-slate-200 pt-[env(safe-area-inset-top)]">
              <div className="max-w-[1440px] mx-auto px-4 sm:px-6 h-[60px] flex items-center justify-between gap-4 sm:gap-8">
                <a
                  href="#top"
                  onClick={(e) => {
                    e.preventDefault();
                    setResultFilter('all');
                  }}
                  className="text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0 flex items-center gap-2"
                >
                  <BookOpenIcon className="w-5 h-5 text-blue-700" />
                  <span>책마루</span>
                </a>

                <nav
                  className="hidden md:flex items-center gap-6 text-sm font-medium text-slate-600"
                  aria-label="주요 보기"
                >
                  <button
                    type="button"
                    onClick={() => setResultFilter('all')}
                    className={`whitespace-nowrap shrink-0 py-1 border-b-2 transition-colors ${
                      resultFilter === 'all'
                        ? 'border-blue-700 text-slate-900'
                        : 'border-transparent hover:text-slate-900'
                    }`}
                  >
                    통합 검색
                  </button>
                  <button
                    type="button"
                    onClick={() => setResultFilter('available')}
                    className={`whitespace-nowrap shrink-0 py-1 border-b-2 transition-colors ${
                      resultFilter === 'available'
                        ? 'border-blue-700 text-slate-900'
                        : 'border-transparent hover:text-slate-900'
                    }`}
                  >
                    대출 가능 도서
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setMobileSidebarOpen(true);
                      librarySectionRef.current?.scrollIntoView({
                        behavior: 'smooth',
                      });
                    }}
                    className="whitespace-nowrap shrink-0 py-1 border-b-2 border-transparent hover:text-slate-900 transition-colors"
                  >
                    내 도서관 목록
                  </button>
                </nav>

                <div className="flex items-center gap-2 shrink-0">
                  <button
                    type="button"
                    onClick={() => setIsAddModalOpen(true)}
                    className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-blue-700 text-white text-xs font-semibold hover:bg-blue-800 transition-colors whitespace-nowrap shrink-0"
                  >
                    <PlusIcon className="w-3.5 h-3.5" />
                    <span>도서관 추가</span>
                  </button>
                </div>
              </div>
            </header>

            <main className="flex-1 max-w-[1440px] w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">
              <section
                aria-label="전자책 통합 검색"
                className="bg-white border border-slate-200 rounded-xl p-4 sm:p-6"
              >
                <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-4">
                  <div>
                    <h1
                      className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight"
                      style={{ textWrap: 'balance' }}
                    >
                      가입한 전자도서관 한 번에 검색하기
                    </h1>
                    <p className="text-sm text-slate-600 mt-1">
                      책 제목, 저자, 키워드를 입력하면 내 도서관별 소장 여부와 실시간 대출 가능 권수를 바로 확인합니다.
                    </p>
                  </div>
                  <div className="flex items-center gap-2 lg:hidden">
                    <button
                      type="button"
                      onClick={() => setMobileSidebarOpen((v) => !v)}
                      className="inline-flex items-center gap-1.5 px-3 py-2 min-h-[40px] rounded-lg border border-slate-200 text-xs font-medium text-slate-700 bg-slate-50 hover:bg-slate-100 whitespace-nowrap"
                    >
                      <LibraryIcon className="w-3.5 h-3.5" />
                      <span>검색 도서관 {enabledLibrariesCount}곳 설정</span>
                    </button>
                  </div>
                </div>

                <form
                  onSubmit={handleSearchSubmit}
                  className="flex flex-col sm:flex-row gap-2.5"
                >
                  <div className="flex flex-1 border border-slate-300 rounded-lg bg-white focus-within:ring-2 focus-within:ring-blue-600 focus-within:border-blue-600 overflow-hidden">
                    <label htmlFor="search-field" className="sr-only">
                      검색 기준
                    </label>
                    <select
                      id="search-field"
                      value={searchField}
                      onChange={(e) => setSearchField(e.target.value)}
                      className="px-3 py-2.5 text-[16px] sm:text-sm font-medium text-slate-700 bg-slate-50 border-r border-slate-200 focus:outline-none shrink-0"
                    >
                      <option value="all">통합검색</option>
                      <option value="title">도서명</option>
                      <option value="author">저자</option>
                    </select>

                    <div className="relative flex-1 flex items-center min-w-0">
                      <SearchIcon className="w-4 h-4 text-slate-400 ml-3 shrink-0" />
                      <label htmlFor="book-search-input" className="sr-only">
                        도서 검색어 입력
                      </label>
                      <input
                        id="book-search-input"
                        type="search"
                        enterKeyHint="search"
                        value={queryInput}
                        onChange={(e) => setQueryInput(e.target.value)}
                        placeholder="책 제목, 저자, 키워드를 입력하세요 (예: 한강, 물고기는 존재하지 않는다)"
                        className="w-full min-w-0 px-3 py-2.5 text-[16px] sm:text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none"
                      />
                      {queryInput && (
                        <button
                          type="button"
                          onClick={() => setQueryInput('')}
                          aria-label="검색어 지우기"
                          className="p-2 mr-1 text-slate-400 hover:text-slate-700 rounded"
                        >
                          <XIcon className="w-4 h-4" />
                        </button>
                      )}
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={
                      isLoading || !queryInput.trim() || enabledLibrariesCount === 0
                    }
                    className="px-6 py-2.5 min-h-[44px] rounded-lg bg-slate-900 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-50 transition-colors whitespace-nowrap shrink-0"
                  >
                    {isLoading ? '검색 중...' : '통합 검색'}
                  </button>
                </form>

                <div className="mt-3 flex flex-wrap items-center gap-2 text-xs">
                  <span className="text-slate-500 font-medium">빠른 검색:</span>
                  {QUICK_KEYWORDS.map((kw) => (
                    <button
                      key={kw}
                      type="button"
                      onClick={() => handleQuickKeyword(kw)}
                      className={`px-2.5 py-1 rounded-md transition-colors whitespace-nowrap ${
                        activeQuery === kw
                          ? 'bg-blue-50 text-blue-700 font-semibold'
                          : 'bg-slate-100 text-slate-700 hover:bg-slate-200/70'
                      }`}
                    >
                      {kw}
                    </button>
                  ))}
                </div>
              </section>

              <div className="flex flex-col lg:flex-row items-start gap-6">
                <div
                  ref={librarySectionRef}
                  className={`${
                    mobileSidebarOpen ? 'block' : 'hidden'
                  } lg:block w-full lg:w-auto`}
                >
                  <LibrarySidebar
                    libraries={libraries}
                    summaries={summaries}
                    isSearching={isLoading}
                    onToggleLibrary={handleToggleLibrary}
                    onRemoveLibrary={handleRemoveLibrary}
                    onOpenAddModal={() => setIsAddModalOpen(true)}
                    onResetDefaults={handleResetDefaults}
                  />
                </div>

                <div className="flex-1 min-w-0 w-full flex flex-col gap-4">
                  <div className="flex flex-wrap items-center justify-between gap-3 bg-white border border-slate-200 rounded-xl px-4 py-3">
                    <div className="flex items-center gap-1 p-1 bg-slate-100 rounded-lg max-w-full overflow-x-auto">
                      <button
                        type="button"
                        onClick={() => setResultFilter('all')}
                        className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors whitespace-nowrap tabular-nums ${
                          resultFilter === 'all'
                            ? 'bg-white text-slate-900 shadow-sm'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        전체 ({books.length})
                      </button>
                      <button
                        type="button"
                        onClick={() => setResultFilter('available')}
                        className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors whitespace-nowrap tabular-nums ${
                          resultFilter === 'available'
                            ? 'bg-white text-slate-900 shadow-sm'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        지금 대출 가능 ({availableBookCount})
                      </button>
                      <button
                        type="button"
                        onClick={() => setResultFilter('multi')}
                        className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors whitespace-nowrap ${
                          resultFilter === 'multi'
                            ? 'bg-white text-slate-900 shadow-sm'
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        2곳 이상 소장
                      </button>
                    </div>

                    <div className="flex items-center gap-2 text-xs text-slate-600">
                      <SlidersHorizontalIcon className="w-3.5 h-3.5 text-slate-400" />
                      <label htmlFor="sort-order" className="sr-only">
                        정렬 기준
                      </label>
                      <select
                        id="sort-order"
                        value={sortOrder}
                        onChange={(e) => setSortOrder(e.target.value)}
                        className="bg-transparent font-medium text-slate-700 focus:outline-none cursor-pointer"
                      >
                        <option value="relevance">관련도 · 대출가능순</option>
                        <option value="libraries">보유 도서관 많은순</option>
                        <option value="newest">최신 출간순</option>
                      </select>
                    </div>
                  </div>

                  {errorMessage && (
                    <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 flex items-center justify-between gap-3 text-sm text-rose-800">
                      <div className="flex items-center gap-2.5">
                        <AlertTriangleIcon className="w-4 h-4 shrink-0" />
                        <span>{errorMessage}</span>
                      </div>
                      <button
                        type="button"
                        onClick={() =>
                          executeSearch(activeQuery, searchField, libraries)
                        }
                        className="px-3 py-1.5 text-xs font-semibold bg-white border border-rose-200 rounded-lg hover:bg-rose-100 whitespace-nowrap"
                      >
                        다시 시도
                      </button>
                    </div>
                  )}

                  {enabledLibrariesCount === 0 ? (
                    <div className="bg-white border border-slate-200 rounded-xl p-10 text-center">
                      <p className="text-sm font-semibold text-slate-900">
                        선택된 검색 도서관이 없습니다
                      </p>
                      <p className="text-xs text-slate-500 mt-1">
                        왼쪽 목록에서 도서관을 선택하거나 새로운 도서관을 추가해 주세요.
                      </p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-5 items-start">
                      <div className="xl:col-span-7 flex flex-col gap-2.5">
                        {isLoading ? (
                          Array.from({ length: 6 }).map((_, idx) => (
                            <div
                              key={idx}
                              className="bg-white border border-slate-200 rounded-xl p-4 flex gap-4 animate-pulse"
                            >
                              <div className="w-16 h-[92px] bg-slate-200 rounded-md shrink-0" />
                              <div className="flex-1 flex flex-col gap-2 py-1">
                                <div className="h-4 bg-slate-200 rounded w-3/5" />
                                <div className="h-3 bg-slate-100 rounded w-2/5" />
                                <div className="h-3 bg-slate-100 rounded w-4/5 mt-1" />
                              </div>
                            </div>
                          ))
                        ) : filteredAndSortedBooks.length === 0 ? (
                          <div className="bg-white border border-slate-200 rounded-xl p-10 text-center">
                            <p className="text-sm font-semibold text-slate-900">
                              {activeQuery
                                ? `"${activeQuery}"에 대한 검색 결과가 없습니다`
                                : '검색어를 입력해 도서를 찾아보세요'}
                            </p>
                            <p className="text-xs text-slate-500 mt-1.5">
                              {resultFilter !== 'all'
                                ? '필터를 "전체"로 변경하거나 다른 검색어를 입력해 보세요.'
                                : '도서명이나 저자명 일부만 입력해 보시거나 검색 대상 도서관을 추가해 보세요.'}
                            </p>
                            {resultFilter !== 'all' && books.length > 0 && (
                              <button
                                type="button"
                                onClick={() => setResultFilter('all')}
                                className="mt-4 px-4 py-2 text-xs font-semibold bg-slate-900 text-white rounded-lg hover:bg-blue-700 transition-colors"
                              >
                                전체 결과 보기
                              </button>
                            )}
                          </div>
                        ) : (
                          filteredAndSortedBooks.map((book) => {
                            const isSelected = selectedBook?.id === book.id;
                            const heldNames = book.availabilities
                              .filter(
                                (a) =>
                                  a.status === 'available' ||
                                  a.status === 'subscription_available' ||
                                  a.status === 'loaned'
                              )
                              .map((a) => {
                                const lib = libraries.find(
                                  (l) => l.id === a.libraryId
                                );
                                return lib?.shortName || a.libraryName;
                              });

                            return (
                              <button
                                key={book.id}
                                type="button"
                                onClick={() => {
                                  setSelectedBookId(book.id);
                                  setMobileDetailOpen(true);
                                }}
                                className={`w-full text-left rounded-xl border p-4 flex items-start gap-4 transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-600 ${
                                  isSelected
                                    ? 'bg-blue-50/45 border-blue-600'
                                    : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50/50'
                                }`}
                              >
                                <BookCover
                                  src={book.coverUrl}
                                  title={book.title}
                                  size="md"
                                />

                                <div className="min-w-0 flex-1">
                                  <h3 className="text-[15px] font-bold text-slate-900 leading-snug line-clamp-2 break-keep">
                                    {book.title}
                                  </h3>

                                  <div className="mt-1 text-xs text-slate-600 flex flex-wrap items-center gap-1.5">
                                    <span className="font-medium text-slate-800">
                                      {book.author}
                                    </span>
                                    <span aria-hidden="true">·</span>
                                    <span>{book.publisher}</span>
                                    {book.publishDate && (
                                      <>
                                        <span aria-hidden="true">·</span>
                                        <span className="tabular-nums text-slate-500">
                                          {book.publishDate}
                                        </span>
                                      </>
                                    )}
                                  </div>

                                  {book.description && (
                                    <p className="mt-2 text-xs text-slate-500 line-clamp-2 leading-relaxed">
                                      {book.description}
                                    </p>
                                  )}

                                  <div className="mt-3 pt-2.5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs">
                                    <div className="flex items-center gap-2 min-w-0 flex-1">
                                      {book.availableLibraryCount > 0 ? (
                                        <span className="inline-flex items-center gap-1 font-semibold text-emerald-700 tabular-nums shrink-0">
                                          <CheckCircle2Icon className="w-3.5 h-3.5 shrink-0" />
                                          <span>
                                            대출 가능 {book.availableLibraryCount}곳
                                          </span>
                                        </span>
                                      ) : book.heldLibraryCount > 0 ? (
                                        <span className="inline-flex items-center gap-1 font-semibold text-amber-700 shrink-0">
                                          <ClockIcon className="w-3.5 h-3.5 shrink-0" />
                                          <span>소장처 모두 대출중</span>
                                        </span>
                                      ) : (
                                        <span className="inline-flex items-center gap-1 font-semibold text-blue-700 shrink-0">
                                          <ExternalLinkIcon className="w-3.5 h-3.5 shrink-0" />
                                          <span>도서관별 직접 검색</span>
                                        </span>
                                      )}
                                      {heldNames.length > 0 && (
                                        <>
                                          <span
                                            aria-hidden="true"
                                            className="text-slate-300 shrink-0"
                                          >
                                            ·
                                          </span>
                                          <span className="text-slate-600 truncate min-w-0 flex-1">
                                            {heldNames.join(', ')}
                                          </span>
                                        </>
                                      )}
                                    </div>

                                    <span className="text-[11px] font-medium text-blue-700 whitespace-nowrap shrink-0">
                                      대출여부 확인 →
                                    </span>
                                  </div>
                                </div>
                              </button>
                            );
                          })
                        )}
                      </div>

                      <div className="hidden xl:block xl:col-span-5 sticky top-20">
                        <BookDetailPanel book={selectedBook} />
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </main>

            {mobileDetailOpen && selectedBook && (
              <div
                className="xl:hidden fixed inset-0 z-40 bg-slate-900/45 flex items-end sm:items-center justify-center p-0 sm:p-4"
                role="dialog"
                aria-modal="true"
              >
                <div className="w-full max-w-2xl max-h-[88dvh] overflow-y-auto overscroll-contain [-webkit-overflow-scrolling:touch] pb-[env(safe-area-inset-bottom)] rounded-t-2xl sm:rounded-xl bg-white shadow-2xl">
                  <BookDetailPanel
                    book={selectedBook}
                    onCloseMobile={() => setMobileDetailOpen(false)}
                  />
                </div>
              </div>
            )}

            <AddLibraryModal
              isOpen={isAddModalOpen}
              libraries={libraries}
              onClose={() => setIsAddModalOpen(false)}
              onAddLibrary={handleAddLibrary}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
